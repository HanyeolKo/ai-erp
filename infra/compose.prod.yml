name: ai-erp-phase1

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ai_erp_phase1_postgres_data:/var/lib/postgresql
    networks: [internal]
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    <<: *service-security

  redis:
    image: redis:8.2.9
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ai_erp_phase1_redis_data:/data
    networks: [internal]
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 24
    <<: *service-security

  migrate:
    image: flyway/flyway:11.3.4
    profiles: [migration]
    environment:
      FLYWAY_URL: ${DB_URL}
      FLYWAY_USER: ${DB_USERNAME}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_SCHEMAS: platform,identity,group,project,schedule,notification,calendar_integration,audit
      FLYWAY_DEFAULT_SCHEMA: platform
      FLYWAY_CREATE_SCHEMAS: "true"
    command: ["migrate"]
    volumes:
      - ${RELEASE_SOURCE_DIR:-.}/backend/src/main/resources/db/migration:/flyway/sql:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.50"
    <<: *service-security

  app-blue: &app
    image: ${APP_IMAGE}
    restart: unless-stopped
    pull_policy: never
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      APP_OIDC_ENABLED: ${APP_OIDC_ENABLED}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPRING_FLYWAY_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --connect-timeout 2 --max-time 4 http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    <<: *service-security

  app-green:
    <<: *app

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_STATE_DIR:-/home/deploy/ai-erp/shared/caddy}:/etc/caddy/state:ro
      - ai_erp_phase1_caddy_data:/data
      - ai_erp_phase1_caddy_config:/config
    networks: [internal]
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *service-security

networks:
  internal:
    name: ai-erp-phase1-internal
    driver: bridge

volumes:
  ai_erp_phase1_postgres_data:
    name: ai_erp_phase1_postgres_data
  ai_erp_phase1_redis_data:
    name: ai_erp_phase1_redis_data
  ai_erp_phase1_caddy_data:
    name: ai_erp_phase1_caddy_data
  ai_erp_phase1_caddy_config:
    name: ai_erp_phase1_caddy_config
