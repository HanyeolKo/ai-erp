plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.20.1'
}

group = 'com.aierp'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations.named('integrationTestImplementation') {
    extendsFrom configurations.testImplementation
}

configurations.named('integrationTestRuntimeOnly') {
    extendsFrom configurations.testRuntimeOnly
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.modulith:spring-modulith-core:2.1.1'
    implementation 'org.eclipse.angus:angus-mail:2.0.3'

    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jpa'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test:2.1.1'

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    integrationTestImplementation 'org.springframework.session:spring-session-jdbc'
    integrationTestImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:18.6.0')
    integrationTestImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    integrationTestRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-windows-amd64'
    integrationTestAnnotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jpa'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Verify the generated document itself after REST Docs has produced the OpenAPI file.
tasks.test {
    outputs.dir(layout.buildDirectory.dir('generated-snippets'))
    exclude '**/OpenApiContractTest.class'
}
tasks.register('openapiContractTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/OpenApiContractTest.class'
    dependsOn tasks.named('normalizeWorkspaceOpenApi')
}

tasks.register('normalizeWorkspaceOpenApi', JavaExec) {
    description = 'Normalizes generated workspace scalar unions that restdocs-api-spec cannot represent.'
    group = 'verification'
    dependsOn tasks.named('openapi3')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aierp.OpenApiWorkspaceSchemaNormalizer'
    args file('build/api-spec/openapi3.yaml').absolutePath
}

tasks.register('integrationTest', Test) {
    description = 'Runs PostgreSQL integration tests with an isolated H2 JDBC session repository.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.test
    useJUnitPlatform()
    systemProperty 'spring.data.redis.url', 'redis://127.0.0.1:1'
    systemProperty 'management.health.redis.enabled', 'false'
    systemProperty 'management.endpoint.health.group.readiness.include', 'readinessState,db'
    exclude '**/RedisSessionIntegrationTest.class'
}

tasks.register('redisIntegrationTest', Test) {
    description = 'Runs the Redis 8.2.9 Spring Session integration test against an explicit loopback test endpoint.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    include '**/RedisSessionIntegrationTest.class'
    shouldRunAfter tasks.named('integrationTest')
    useJUnitPlatform()
    doFirst {
        if (!System.getenv('AI_ERP_REDIS_TEST_URL')) {
            throw new GradleException('AI_ERP_REDIS_TEST_URL is required for redisIntegrationTest')
        }
    }
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

openapi3 {
    server = 'http://localhost:8080'
    title = 'AI ERP Foundation API'
    description = 'REST Docs 테스트로 생성된 초기 기반 API 명세입니다.'
    version = project.version.toString()
    format = 'yaml'
    outputFileNamePrefix = 'openapi3'
}

tasks.configureEach {
    if (name == 'openapi3') {
        dependsOn tasks.test
        finalizedBy tasks.named('openapiContractTest')
    }
}
