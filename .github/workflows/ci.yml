name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
        with:
          version: '10.33.0'
      - run: pnpm install --frozen-lockfile
      - run: ruby .github/workflows/tests/validate_workflows.rb
      - run: docker compose --env-file infra/.env.example -f infra/compose.dev.yml config --quiet
      - run: APP_IMAGE=ai-erp:config-check docker compose --env-file infra/.env.prod.example -f infra/compose.prod.yml config --quiet
      - run: |
          bash -n scripts/preflight.sh
          bash -n scripts/backup.sh
          bash -n scripts/deploy.sh
          bash -n scripts/rollback.sh
          bash -n scripts/smoke.sh
      - run: bash scripts/tests/deployment-contract.sh
      - run: bash scripts/tests/caddy-no-sni.sh
      - run: ./gradlew clean test integrationTest openapi3 bootJar
        working-directory: backend
      - run: pnpm api:generate
      - run: pnpm frontend:test
      - run: pnpm frontend:typecheck
      - run: pnpm frontend:build
      - run: docker build --tag ai-erp:ci .
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-artifacts
          path: |
            backend/build/reports
            backend/build/api-spec
            backend/build/api-docs
